<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Mahameru Drum - Packaging Industri Tangerang</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; line-height: 1.6; }
        
        /* Navigation Header */
        .header { background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; padding: 12px 24px; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-box img { height: 44px; border-radius: 6px; object-fit: contain; }
        .logo-box h1 { font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { text-decoration: none; color: #475569; font-weight: 600; font-size: 14px; }
        .btn-wa-nav { background: #22c55e; color: #fff !important; padding: 8px 16px; border-radius: 6px; font-weight: 700 !important; }

        /* Hero / Banner Utama */
        .hero { background: #ffffff; padding: 40px 20px; border-bottom: 1px solid #e2e8f0; }
        .hero-inner { max-width: 1100px; margin: 0 auto; text-align: center; }
        .tagline { display: inline-block; background: #e0f2fe; color: #0284c7; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; }
        .hero-inner h2 { font-size: 32px; color: #0f172a; margin-bottom: 12px; }
        .hero-inner p { font-size: 16px; color: #64748b; max-width: 700px; margin: 0 auto 24px auto; }
        
        /* Call to Action Buttons */
        .social-buttons { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn-store { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .btn-shopee { background: #ee4d2d; color: white; }
        .btn-tiktok { background: #000000; color: white; }
        .btn-wa { background: #22c55e; color: white; }

        /* Banner Box */
        .banner-container { max-width: 1000px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #cbd5e1; }
        .banner-container img { width: 100%; display: block; }

        /* Catalog Layout */
        .catalog { padding: 50px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 24px; color: #0f172a; margin-bottom: 30px; font-weight: 800; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        /* Product Card Styling */
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .card h3 { font-size: 15px; color: #0f172a; margin-bottom: 6px; }
        .card p { font-size: 12px; color: #64748b; margin-bottom: 12px; min-height: 36px; }
        .btn-card-wa { display: block; width: 100%; padding: 8px 0; background: #22c55e; color: white; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 13px; }

        /* Footer Section */
        .footer { background: #0f172a; color: #94a3b8; padding: 40px 20px; margin-top: 50px; }
        .footer-container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .footer h4 { color: white; margin-bottom: 12px; font-size: 16px; }
        .footer p { font-size: 13px; line-height: 1.8; }
        .map-box { width: 100%; height: 180px; border-radius: 8px; border: 0; }
    </style>
</head>

                     alt="Logo CV Mahameru Drum">
                <h1>CV MAHAMERU DRUM</h1>
